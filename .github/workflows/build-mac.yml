name: Build Mac installers

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize for public distribution (requires Apple secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned universal installer
        if: ${{ !inputs.signed }}
        run: pnpm build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check signing credentials
        if: ${{ inputs.signed }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
      - name: Build signed and notarized universal installer
        if: ${{ inputs.signed }}
        run: pnpm build:mac --config.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify universal app
        shell: bash
        run: |
          lipo "dist/mac-universal/Hoop League Studio.app/Contents/MacOS/Hoop League Studio" -verify_arch arm64 x86_64
          lipo "dist/mac-universal/Hoop League Studio.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v6
        with:
          name: Hoop-League-Studio-Mac-universal-${{ inputs.signed && 'signed' || 'unsigned' }}
          path: dist/*_universal.dmg
          if-no-files-found: error
